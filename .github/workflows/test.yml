name: Validate and Publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  # Re-run a publish without touching the tag and without adding a commit.
  workflow_dispatch:

# Least privilege by default; publish-github-packages re-adds `packages: write`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing must never be cancelled half-way; PR runs are safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate package boundary
        run: |
          npm pack --dry-run --json > /tmp/opencode-thinking-fix-pack.json
          node -e "const fs=require('node:fs'); const pack=JSON.parse(fs.readFileSync('/tmp/opencode-thinking-fix-pack.json','utf8'))[0]; const files=pack.files.map(f=>f.path); const forbidden=files.filter(f=>/(^|\/)(tests|docs|node_modules|\.serena)(\/|$)|(^|\/)(AGENTS|CHANGELOG)\.md$/.test(f)); if(forbidden.length){console.error('Forbidden package files:',forbidden); process.exit(1)} if(!files.includes('proxy/core.js')){console.error('proxy/core.js missing from package'); process.exit(1)}"
      - name: Run proxy test suite
        run: node tests/test-proxy.js
      - name: Run plugin test suite
        run: node tests/test-plugin.js && node tests/test-plugin-v2.js

  publish-npm:
    name: publish-npm
    needs: validate
    # Tags publish; workflow_dispatch re-publishes the current version without a new commit.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # OIDC trusted publishing: npm verifies the short-lived workflow identity token
    # against the trusted publisher configured on npmjs.com. No NPM_TOKEN secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # npm docs: never use dependency caching in a publish workflow — a poisoned
          # cache is a credential-exposure surface.
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Under OIDC there is no token to check and `npm whoami` does not authenticate,
      # so the preflight narrows to the tag/version pairing that guards against
      # publishing under the wrong number.
      - name: Preflight — tag and version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag" ]; then
              echo "::error title=Tag/version mismatch::Tag is v${tag} but package.json says ${version}. Bump one so the publish cannot land under the wrong number."
              exit 1
            fi
          fi
          echo "package opencode-thinking-fix@${version} (ref: ${GITHUB_REF_NAME})"
      - name: Publish to npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # npm refuses to publish over an existing version, so re-running a tag that is
          # already out is a success, not a failure.
          if npm view "opencode-thinking-fix@${version}" version >/dev/null 2>&1; then
            echo "opencode-thinking-fix@${version} is already published — nothing to do (idempotent re-run)."
          else
            npm publish --provenance
          fi
      - name: Remove stray probecheck dist-tag (one-off — delete this step once done)
        run: |
          set -euo pipefail
          # setup-node writes `:_authToken=${NODE_AUTH_TOKEN}` which resolves to an empty
          # string once the token secret is gone; that empty bearer breaks even public
          # reads. Drop it so npm falls back to the OIDC exchange for the write.
          npm config delete "//registry.npmjs.org/:_authToken" || true
          if npm dist-tag ls opencode-thinking-fix | grep -q '^probecheck:'; then
            npm dist-tag rm opencode-thinking-fix probecheck
          else
            echo "probecheck dist-tag already absent — nothing to do"
          fi
      - name: Verify the published tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # The registry needs a moment before it serves a version that was just published.
          # Packing immediately failed this step with ETARGET while the publish itself was
          # fine, so wait for the version to become visible before unpacking it.
          for attempt in $(seq 1 12); do
            if npm view "opencode-thinking-fix@${version}" version >/dev/null 2>&1; then
              echo "registry is serving ${version} (attempt ${attempt})"
              break
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "::error title=Version not visible on npm::opencode-thinking-fix@${version} did not appear within 60s of a successful publish."
              exit 1
            fi
            sleep 5
          done
          npm pack "opencode-thinking-fix@${version}" --pack-destination "${RUNNER_TEMP}" >/dev/null
          tar -tzf "${RUNNER_TEMP}/opencode-thinking-fix-${version}.tgz" | sort > "${RUNNER_TEMP}/published.txt"
          cat "${RUNNER_TEMP}/published.txt"
          for required in package/proxy/core.js package/plugins/opencode-thinking-fix-universal.ts package/package.json; do
            grep -qx "${required}" "${RUNNER_TEMP}/published.txt" || {
              echo "::error title=Incomplete npm tarball::${required} is missing from the published package."
              exit 1
            }
          done

  publish-github-packages:
    name: publish-github-packages
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tbosancheros39'
      - run: npm ci
      - name: Set scoped name for GitHub Packages
        run: npm pkg set name=@tbosancheros39/opencode-thinking-fix
      - name: Preflight — tag and version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error title=Tag/version mismatch::Tag is v${tag} but package.json says ${version}."
            exit 1
          fi
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@tbosancheros39/opencode-thinking-fix@${version}" version >/dev/null 2>&1; then
            echo "@tbosancheros39/opencode-thinking-fix@${version} is already published — nothing to do (idempotent re-run)."
            exit 0
          fi
          npm publish
