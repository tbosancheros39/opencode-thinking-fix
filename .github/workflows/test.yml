name: Validate and Publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  # Re-run a publish without touching the tag and without adding a commit.
  workflow_dispatch:

# Least privilege by default; publish-github-packages re-adds `packages: write`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing must never be cancelled half-way; PR runs are safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate package boundary
        run: |
          npm pack --dry-run --json > /tmp/opencode-thinking-fix-pack.json
          # npm <= 11 prints an array of packs; npm 12 prints a map keyed by package name.
          # Accept both so the check does not depend on the runner's npm major.
          node -e "const fs=require('node:fs'); const raw=JSON.parse(fs.readFileSync('/tmp/opencode-thinking-fix-pack.json','utf8')); const pack=Array.isArray(raw)?raw[0]:Object.values(raw)[0]; if(!pack||!pack.files){console.error('Unexpected npm pack JSON shape'); process.exit(1)} const files=pack.files.map(f=>f.path); const forbidden=files.filter(f=>/(^|\/)(tests|docs|node_modules|\.serena)(\/|$)|(^|\/)(AGENTS|CHANGELOG)\.md$/.test(f)); if(forbidden.length){console.error('Forbidden package files:',forbidden); process.exit(1)} if(!files.includes('proxy/core.js')){console.error('proxy/core.js missing from package'); process.exit(1)}"
      - name: Run proxy test suite
        run: node tests/test-proxy.js
      - name: Run plugin test suite
        run: node tests/test-plugin.js && node tests/test-plugin-v2.js

  publish-npm:
    name: publish-npm
    needs: validate
    # Tags publish; workflow_dispatch re-publishes the current version without a new commit.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # OIDC trusted publishing: npm verifies the short-lived workflow identity token
    # against the trusted publisher configured on npmjs.com. No NPM_TOKEN secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # npm docs: never use dependency caching in a publish workflow — a poisoned
          # cache is a credential-exposure surface.
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Under OIDC there is no token to check and `npm whoami` does not authenticate,
      # so the preflight narrows to the tag/version pairing that guards against
      # publishing under the wrong number.
      - name: Preflight — tag and version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag" ]; then
              echo "::error title=Tag/version mismatch::Tag is v${tag} but package.json says ${version}. Bump one so the publish cannot land under the wrong number."
              exit 1
            fi
          fi
          echo "package opencode-thinking-fix@${version} (ref: ${GITHUB_REF_NAME})"
      - name: Publish to npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # npm refuses to publish over an existing version, so re-running a tag that is
          # already out is a success, not a failure.
          if npm view "opencode-thinking-fix@${version}" version >/dev/null 2>&1; then
            echo "opencode-thinking-fix@${version} is already published — nothing to do (idempotent re-run)."
          else
            npm publish --provenance
          fi
      - name: Verify the published tarball
        # Reading a public package needs no credentials, so this step carries none: the
        # NPM_TOKEN secret is retired now that publishing goes through OIDC.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # The registry's read replicas can serve a freshly published version a minute later,
          # and `npm view` caches the miss. Poll the registry directly, cache-busted, for up to
          # five minutes: the 60s window here once expired one second before the tarball was
          # served, which reported a perfectly good release as missing.
          ready=0
          for attempt in $(seq 1 30); do
            # Probe with npm itself, not curl: on 2026-10-23 the origin packument
            # answered curl while a read replica still served a stale packument to
            # npm pack, so the tarball check died on ETARGET even though the
            # version was published. Only when npm itself resolves the version is
            # it safe to pack and diff the tarball; keep polling up to five minutes.
            if npm view "opencode-thinking-fix@${version}" version --prefer-online 2>/dev/null | grep -qx "${version}"; then
              echo "registry is serving ${version} (attempt ${attempt})"
              ready=1
              break
            fi
            echo "attempt ${attempt}/30: ${version} not visible yet"
            sleep 10
          done
          if [ "${ready}" -ne 1 ]; then
            echo "::error title=Version not visible on npm::opencode-thinking-fix@${version} did not appear within 5 minutes of a successful publish."
            exit 1
          fi
          npm pack "opencode-thinking-fix@${version}" --prefer-online --pack-destination "${RUNNER_TEMP}" >/dev/null
          tar -tzf "${RUNNER_TEMP}/opencode-thinking-fix-${version}.tgz" | sort > "${RUNNER_TEMP}/published.txt"
          cat "${RUNNER_TEMP}/published.txt"
          for required in package/proxy/core.js package/plugins/opencode-thinking-fix-universal.ts package/package.json; do
            grep -qx "${required}" "${RUNNER_TEMP}/published.txt" || {
              echo "::error title=Incomplete npm tarball::${required} is missing from the published package."
              exit 1
            }
          done

  publish-github-packages:
    name: publish-github-packages
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tbosancheros39'
      - run: npm ci
      - name: Set scoped name for GitHub Packages
        run: npm pkg set name=@tbosancheros39/opencode-thinking-fix
      - name: Preflight — tag and version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error title=Tag/version mismatch::Tag is v${tag} but package.json says ${version}."
            exit 1
          fi
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@tbosancheros39/opencode-thinking-fix@${version}" version >/dev/null 2>&1; then
            echo "@tbosancheros39/opencode-thinking-fix@${version} is already published — nothing to do (idempotent re-run)."
            exit 0
          fi
          npm publish
