# One-off: remove the stray `probecheck` dist-tag (points at 4.0.0).
# Uses the repo's NPM_TOKEN secret (classic automation token — the only token
# type still allowed to mutate dist-tags). Delete this file after it runs.
name: Dist-tag cleanup
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-probecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Remove stray probecheck dist-tag
        run: npm dist-tag rm opencode-thinking-fix probecheck
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
